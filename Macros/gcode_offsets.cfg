[gcode_macro SET_GCODE_OFFSET]
description: Saving Z-Offset
rename_existing: _SET_GCODE_OFFSET
gcode:
  {% if printer.save_variables.variables.zoffset %}
    {% set zoffset = printer.save_variables.variables.zoffset %}
  {% else %}
    {% set zoffset = {'z': None} %}
  {% endif %}
  {% set ns = namespace(zoffset={'z': zoffset.z}) %}
  _SET_GCODE_OFFSET {% for p in params %}{'%s=%s '% (p, params[p])}{% endfor %}
  {%if 'Z' in params %}
    {% set null = ns.zoffset.update({'z': params.Z}) %}
  {% endif %}
  {%if 'Z_ADJUST' in params %}
    {%if ns.zoffset.z == None %}
      {% set null = ns.zoffset.update({'z': 0}) %}
    {% endif %}
    {% set null = ns.zoffset.update({'z': (ns.zoffset.z | float) + (params.Z_ADJUST | float)}) %}
  {% endif %}
  SAVE_VARIABLE VARIABLE=zoffset VALUE="{ns.zoffset}"


[delayed_gcode LOAD_GCODE_OFFSETS]
initial_duration: 2
gcode:
  {% if printer.save_variables.variables.zoffset %}
    {% set zoffset = printer.save_variables.variables.zoffset %}
    _SET_GCODE_OFFSET {% for axis, offset in zoffset.items() if zoffset[axis] %}{ "%s=%s " % (axis, offset) }{% endfor %}
    RESPOND TYPE=command MSG="Loaded Z-Offset from variables.cfg: {zoffset.z}mm"
  {% endif %}
  SHOW_CURRENT_XY_OFFSET


[gcode_macro CHANGE_XY_OFFSET]
description: Change X and Y offsets
gcode:
  {% set x_offset = params.X_OFFSET|default(0.0)|float %}
  {% set y_offset = params.Y_OFFSET|default(0.0)|float %}
  SAVE_VARIABLE VARIABLE=x_offset VALUE={x_offset}
  SAVE_VARIABLE VARIABLE=y_offset VALUE={y_offset}
  RESPOND TYPE=command MSG="Current XY offsets: X={x_offset} Y={y_offset}"

[gcode_macro _SET_XY_OFFSET]
description: Set X and Y offsets
gcode:
  {% set x_offset = printer.save_variables.variables.x_offset|float %}
  {% set y_offset = printer.save_variables.variables.y_offset|float %}
  SET_GCODE_OFFSET X={x_offset} Y={y_offset}
  RESPOND TYPE=command MSG="Current XY offsets: X={x_offset} Y={y_offset}"


[gcode_macro SHOW_CURRENT_XY_OFFSET]
description: Show current X and Y offsets
gcode:
  {% set x_offset = printer.save_variables.variables.x_offset|float %}
  {% set y_offset = printer.save_variables.variables.y_offset|float %}
  RESPOND TYPE=command MSG="Current XY offsets: X={x_offset} Y={y_offset}"


[gcode_macro RESET_XY_OFFSET]
description: Set X and Y offsets to 0
gcode:
  CHANGE_XY_OFFSET X=0 Y=0
